<!DOCTYPE html>
<html lang="sv"><head><meta charset="UTF-8">
<script>try{if(localStorage.getItem("slutenvard-tema")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processen och ICF</title>
<meta name="description" content="Vilket steg eller vilken komponent hör fyndet till?">
<meta name="theme-color" content="#0c070a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234F0433'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='%23EDDBE4' text-anchor='middle'%3ESV%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>/* Redaktionell stil (mörkt tema som standard, ljust som val), struktur genom typografi och tunna linjer. Raka hörn, inga skuggor.
   KI-palett (plommon) + DM Sans. Modulfärgerna används bara som små markörer. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--c:#870052;--ct:color-mix(in srgb,var(--c) 45%,#fff);
 --page:#0c070a;--panel:#2a1c25;--panel-hover:#3a2632;--ink:#efe7eb;--mute:#b3a5ad;--rule:#4b3942;--hair:#2b2027;
 --strong:#f1d3e3;--accent:#FF876F;--hl:#FF876F;--band:#870052;--btn:#870052;--btn-hover:#a3176a;--ok:#74cfa0;--bad:#f0908b;--today:rgba(135,0,82,.45)}
:root[data-theme="light"]{color-scheme:light;--ct:var(--c);
 --page:#fff;--panel:#F1F1F1;--panel-hover:#E4E4E4;--ink:#1c1c1c;--mute:#5f5f5f;--rule:#d4d4d4;--hair:#e8e8e8;
 --strong:#4F0433;--accent:#C4452D;--hl:#FF876F;--band:#4F0433;--btn:#4F0433;--btn-hover:#870052;--ok:#2E6B4F;--bad:#A23A37;--today:#EBEBEB}
html{-webkit-text-size-adjust:100%;--gut:clamp(1rem,4vw,3.5rem)}
body{font-family:'DM Sans',Arial,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--page);max-width:1240px;margin:0 auto;padding:0 var(--gut) 4rem}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--strong)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.small{font-size:14px;color:var(--mute)}
.note{margin:.4rem 0 1.2rem}

/* Sidhuvud */
body::before{content:"";display:block;height:6px;background:var(--band);margin:0 calc(-1 * var(--gut))}
.crumb{display:flex;gap:1.2rem;font-size:14px;padding:1rem 0 0}
.crumb a{text-decoration:none;font-weight:500}
.hero{padding:2.2rem 0 1.4rem;border-bottom:1px solid var(--rule);margin-bottom:1.6rem}
.hero .tag{font-size:14px;color:var(--ct);font-weight:500;margin-bottom:.4rem}
.hero h1{font-size:clamp(34px,4.5vw,56px);line-height:1.05;font-weight:800;letter-spacing:-.02em;color:var(--strong)}
.hero .sub{font-size:18px;color:var(--mute);margin-top:.7rem;max-width:34em}
h2{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.01em;color:var(--strong);margin:3rem 0 1.2rem}
h2::after{content:"";display:block;width:48px;height:3px;background:var(--hl);margin-top:.55rem}
h3{font-size:19px;line-height:1.3;color:var(--strong);font-weight:700}

body{position:relative}
.theme-btn{position:absolute;top:1rem;right:var(--gut);font-size:14px;font-weight:500;color:var(--accent);padding:.1rem 0;border-bottom:1px solid currentColor}
.theme-btn:hover{color:var(--strong)}

/* Etiketter i löptext */
.lab{font-size:14px;font-weight:700;color:var(--strong)}
.pill{font-size:14px;font-weight:700}
.pill.exam{color:var(--strong)}.pill.due{color:var(--accent)}.pill.must{color:var(--mute)}
.pill+.pill::before{content:"·";color:var(--rule);margin-right:.45rem;font-weight:400}
.mod{font-size:14px;font-weight:500;color:var(--mute)}
.mod::before{content:"";display:inline-block;width:.6em;height:.6em;background:var(--c);margin-right:.4em;vertical-align:.05em}
.m1{--c:#8A2A6B}.m2{--c:#1F5F8B}.m3{--c:#2E7D5B}.m4{--c:#8F5F0E}.m5{--c:#5B4B9A}.m6{--c:#B0413E}
.legend{font-size:14px;margin:0 0 .6rem}

/* Knappar och val */
.btns{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.9rem}
.btn{display:inline-block;font-size:15px;font-weight:700;background:var(--btn);color:#fff;border:1.5px solid var(--btn);padding:.45rem 1rem;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover);color:#fff}
.btn.alt{background:transparent;color:var(--strong);border-color:var(--strong)}.btn.alt:hover{background:var(--panel-hover);color:var(--strong)}
.btn.ok{background:transparent;color:var(--ok);border-color:var(--ok)}.btn.ok:hover{background:var(--ok);color:var(--page)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}.btn.bad:hover{background:var(--bad);color:var(--page)}
.chips,.modes{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;margin:.2rem 0 .8rem}
.chip{font-size:15px;color:var(--mute);padding:.2rem 0;border-bottom:2px solid transparent}
.chip:hover{color:var(--strong)}
.chip.on{color:var(--strong);font-weight:700;border-bottom-color:var(--hl)}
.tabs{display:flex;gap:1.6rem;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-bottom:1px solid var(--rule);margin-bottom:1.6rem}
.tabs button{font-size:16px;color:var(--mute);padding:.5rem 0;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--strong)}
.tabs button.on{color:var(--strong);font-weight:700;border-bottom-color:var(--hl)}

/* Läsbar radlängd: sidan är bred, texten är det inte */
.tool,.card,.bd,.next,.tabs~.panel .draw{max-width:880px}
.it{max-width:1000px}

/* Block: inga lådor, bara luft och linjer */
.card,.tool{padding:0;margin:0 0 2.2rem}
.tool h3{margin-bottom:.35rem}
.tool>.small:first-of-type{margin-bottom:.4rem}
details.card{border-top:1px solid var(--rule);padding-top:.8rem}
details>summary{cursor:pointer;color:var(--strong);font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:inline-block;width:1.1em;font-weight:400}
details[open]>summary::before{content:"–"}
.card ul{padding-left:1.1rem}.card li{margin-bottom:.5rem}
.card p+p{margin-top:.6rem}
ul.plain,ol.plain{padding-left:1.2rem}ul.plain li,ol.plain li{margin-bottom:.35rem}
.grp{display:block;margin-top:1.1rem;padding-bottom:.25rem;border-bottom:1px solid var(--rule)}

/* Härnäst */
.next{margin:0 0 1rem}
.next>.lab{display:block;margin-bottom:.2rem}
.next ol{list-style:none;border-top:1px solid var(--rule)}
.next li{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--hair)}
.next .cd{font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums}
.next a{color:var(--ink);text-decoration:none}.next a:hover{color:var(--accent);text-decoration:underline}
.next>.small{margin-top:.5rem}

/* Datum: tidslinje med datum i marginalen */
.it{display:grid;grid-template-columns:6.5rem 1fr;gap:1.2rem;padding:1.3rem 0;border-top:1px solid var(--rule);scroll-margin-top:1rem}
.it[hidden]{display:none}
.dt{color:var(--strong);line-height:1}
.dt b{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dt span{font-size:15px;font-weight:700}
.dt small{display:block;font-size:14px;color:var(--mute);margin-top:.35rem}
.it.due .dt,.it.must .dt{color:var(--accent)}
.it.must .dt b{font-weight:500}
.top{display:flex;flex-wrap:wrap;gap:.2rem .8rem;margin-bottom:.25rem}
.bd{min-width:0}
.bd h3{font-size:20px}
.when{font-size:16px;color:var(--accent);font-weight:500;margin:.15rem 0 .5rem;font-variant-numeric:tabular-nums}
.bd p{margin-bottom:.5rem}
.r{display:grid;grid-template-columns:6.5rem 1fr;gap:.8rem;font-size:15px;padding:.3rem 0}
.todo{margin-top:.5rem}
.todo .lab{display:block}
.it.today{background:linear-gradient(90deg,var(--today),transparent 70%);margin:0 calc(-1 * var(--gut));padding:1.3rem var(--gut)}
.it.today .dt small::after{content:" · idag";color:var(--strong);font-weight:700}
.it.past{opacity:.45}

/* Startsidan: paneler som tydligt är klickbara (kicker, rubrik, linje, knapp) */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.2rem}
.mgrid.two{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.panel-link>.pbtn{margin-top:auto}
.panel-link{display:flex;flex-direction:column;background:var(--panel);color:var(--ink);text-decoration:none;padding:1.3rem 1.2rem 1.2rem;border-top:4px solid var(--strong);transition:background .15s}
.panel-link:hover{background:var(--panel-hover);color:var(--ink)}
.kick{font-size:14px;font-weight:700;color:var(--accent)}
.ptitle{display:block;font-size:23px;line-height:1.2;font-weight:800;color:var(--strong);margin:.3rem 0 .2rem}
.ptitle::after{content:none}
.panel-link .ptitle+*{border-top:2px solid var(--hl);padding-top:.7rem;margin-top:.5rem}
.mdates{list-style:none;font-size:15px;margin-bottom:.6rem}
.mdates li{padding:.1rem 0}.mdates li.past{color:var(--mute);text-decoration:line-through}
.pdesc{font-size:15px;margin-bottom:.8rem}
.mtools{font-size:14px;color:var(--mute);margin-bottom:1rem}
.pbtn{display:flex;justify-content:space-between;align-items:center;background:var(--btn);color:#fff;font-weight:700;font-size:15px;padding:.65rem .9rem}
.pbtn .arr{transition:transform .15s}
.panel-link:hover .pbtn{background:var(--btn-hover)}.panel-link:hover .arr{transform:translateX(4px)}
.mdone{display:none;font-size:14px;font-weight:700;color:var(--mute);padding:.65rem 0}
.mcard.done{opacity:.6}.mcard.done .pbtn{display:none}.mcard.done .mdone{display:block}
/* Raderna i modulpanelerna linjeras över hela raden (subgrid), så linjer och knappar hamnar i höjd */
.pfoot{margin-top:auto;display:block}
@supports (grid-template-rows:subgrid){
 .mcard{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:0;align-content:start}
 .mcard .pfoot{align-self:end}
 .mgrid.two .panel-link{display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0}
 .mgrid.two .pbtn{align-self:end}
}
/* Modulens färg på kant, rubrikrad, linje och knapp */
.mcard{border-top-color:var(--c)}
.mcard .kick{color:var(--ct)}
.mcard .pbtn{background:var(--c)}
.mcard .ptitle+*{border-top-color:var(--c)}
.mcard:hover .pbtn{background:var(--c);filter:brightness(1.15)}
.more{display:inline-block;margin-top:.6rem;font-weight:700;text-decoration:none}
.more:hover{text-decoration:underline}

/* Modulnavigering */
.modnav{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1rem;border-top:2px solid var(--strong);font-size:15px;font-weight:700}
.modnav a{text-decoration:none}

/* Checklistor */
.oc ul{list-style:none}
.todo ul.plain{margin-top:.2rem}
.oc label,.todo label{display:flex;gap:.7rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--hair);cursor:pointer}
.oc input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;border:1.5px solid var(--strong);margin-top:.2rem;background:transparent;display:grid;place-content:center}
.oc input::after{content:"";width:10px;height:10px;background:var(--strong);transform:scale(0);transition:transform .1s}
.oc input:checked::after{transform:scale(1)}
.oc input:checked+span{color:var(--mute);text-decoration:line-through}

/* Dragning (övning, patientfall, övningstenta) */
.draw{border-left:3px solid var(--strong);padding:.2rem 0 .2rem 1.1rem;margin-top:1rem}
.draw .lab{color:var(--mute);font-weight:500}
.draw h4{font-size:20px;color:var(--strong);margin:.1rem 0 .3rem}
.draw h4+p{margin-bottom:.4rem}
.draw ul{padding-left:1.1rem}.draw li{margin-bottom:.25rem}
.draw details{margin-top:.6rem}
.draw details p{margin-top:.4rem;color:var(--ink)}
.exq{padding-left:1.3rem;margin-bottom:1rem}.exq li{margin-bottom:.9rem}
.case{font-style:italic;margin:.4rem 0 .8rem;max-width:36em}

/* Timer */
.timer{display:grid;grid-template-columns:auto 1fr;column-gap:1.6rem;align-items:center}
.timer h3{grid-column:1/-1}
.clock{font-size:64px;font-weight:700;line-height:1;color:var(--strong);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .btns{margin-top:0}
.timer.over .clock{color:var(--bad)}
.grips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.2rem 1.4rem;margin-top:1rem;border-top:1px solid var(--rule);padding-top:.6rem}
.gbtn{font-size:16px;color:var(--mute);padding:.3rem 0;border-bottom:2px solid transparent}
.gbtn.on{color:var(--strong);font-weight:700;border-bottom-color:var(--hl)}
.gsum{grid-column:1/-1;margin-top:.4rem;font-variant-numeric:tabular-nums}
.warn{color:var(--bad);font-weight:700}
.okc{color:var(--ok);font-weight:700}

/* Kort */
.deck h3 .small{font-weight:400}
.dstat{font-size:14px;color:var(--mute);margin-bottom:1rem;font-variant-numeric:tabular-nums}
.dstat b{color:var(--ink)}
.face{border-top:2px solid var(--strong);border-bottom:1px solid var(--rule);padding:1.2rem 0 1.4rem;min-height:12rem}
.face .q{font-size:23px;font-weight:700;line-height:1.3;color:var(--strong);margin:.5rem 0 1rem;max-width:30em}
.face .a,.exq .a{border-top:1px solid var(--rule);padding-top:.8rem;margin:.6rem 0 .2rem;font-size:16px;max-width:36em}
.face .done{font-size:20px;font-weight:700;color:var(--strong)}
.deck>.small:last-child{margin-top:.6rem}

/* Tabeller */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;border-top:2px solid var(--strong)}
th,td{text-align:left;vertical-align:top;padding:.5rem .7rem .5rem 0}
th{font-size:14px;color:var(--strong);border-bottom:1px solid var(--strong)}
td{border-bottom:1px solid var(--hair)}
th:empty{padding:0}


@media (max-width:560px){
 body{font-size:15.5px}
 .hero{padding:1.6rem 0 1.1rem}
 .hero .sub{font-size:16px}
 .mgrid,.mgrid.two{grid-template-columns:1fr}
 h2{font-size:24px}
 .it{grid-template-columns:1fr;gap:.4rem}
 .dt{display:flex;align-items:baseline;gap:.4rem}
 .dt b{font-size:30px;display:inline}.dt small{display:inline;margin:0 0 0 .3rem}
 .r{grid-template-columns:1fr;gap:0}
 .next li{grid-template-columns:1fr;gap:0}
 .clock{font-size:52px}
 .timer{grid-template-columns:1fr;row-gap:.6rem}
 .face .q{font-size:20px}
 .tabs{gap:1rem}.tabs button{font-size:15px}
}
@media print{
 :root{--page:#fff;--ink:#1c1c1c;--mute:#5f5f5f;--rule:#d4d4d4;--hair:#e8e8e8;--strong:#4F0433;--accent:#C4452D;--hl:#FF876F;--ct:var(--c)}
 body{max-width:none;font-size:11pt;padding:0}
 .theme-btn{display:none}
 body::before,.legend,.chips,.note,.next,.tabs,.timer,.btns,.crumb,.modnav,.modes,.dstat{display:none}
 .panel[hidden],.it[hidden]{display:block}
 .it{display:grid;break-inside:avoid}.it.past{opacity:1}.it.today{background:none;margin:0;padding:1rem 0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Slutenvård: KTC-veckan och övningar */
.pill.info{color:var(--mute)}
.it.info .dt{color:var(--mute)}
.day{padding:.9rem 0;border-top:1px solid var(--rule)}
.day.now{background:linear-gradient(90deg,var(--today),transparent 70%);margin:0 calc(-1 * var(--gut));padding:.9rem var(--gut)}
.slot{display:grid;grid-template-columns:8rem 1fr 13rem;gap:.9rem;padding:.35rem 0;font-size:15px}
.slot .tid{font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums}
.slot .rum{color:var(--mute)}
.r{grid-template-columns:9rem 1fr}
.card{background:var(--panel);padding:.8rem 1rem;margin-bottom:.5rem}
.card p{margin-top:.5rem}
.quiz{max-width:46rem;margin-top:1rem}
.fraga{font-size:22px;line-height:1.3;font-weight:700;color:var(--strong);min-height:3.2em;margin:.3rem 0 .5rem}
.svar{min-height:3em;margin-top:.9rem;font-weight:500}
.svar.ok{color:var(--ok)}.svar.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
[hidden]{display:none!important}
.mgrid.places{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mgrid.places .panel-link{display:flex}
.mgrid.places .pbtn{margin-top:auto}
.mgrid.places .mdates{border-top:2px solid var(--hl);padding-top:.7rem;margin-top:.5rem}
@media (max-width:640px){.slot{grid-template-columns:1fr;gap:.05rem;padding:.5rem 0}.r{grid-template-columns:1fr;gap:.05rem}}
</style></head><body>
